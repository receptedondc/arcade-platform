<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Color Block</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            border: 2px solid #333;
            box-shadow: 0 0 40px rgba(0,255,255,0.35);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth - 40, 900);
            canvas.height = Math.min(window.innerHeight - 40, 700);
        }
        window.addEventListener('resize', resize);
        resize();

        const State = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let state = State.MENU;

        const GRID = 90;
        let COLS = Math.floor(canvas.width / GRID);
        let ROWS = Math.floor(canvas.height / GRID);

        const COLORS = [
            '#ff0040',
            '#00ff80',
            '#00aaff',
            '#ffcc00',
            '#ff5500',
            '#aa00ff',
            '#00ffcc',
            '#ff0088'
        ];
        const COLOR_NAMES = ['RED','GREEN','BLUE','YELLOW','ORANGE','PURPLE','CYAN','PINK'];

        let player = { x: 0, y: 0 };
        let targetColor = 0;
        let floorTimer = 0;
        const FLOOR_CHANGE_INTERVAL = 300;
        let floorColors = [];
        let flashTimer = 0;
        const FLASH_DURATION = 35;

        let score = 0;
        let highScore = 0;
        let particles = [];

        try {
            highScore = parseInt(localStorage.getItem('colorblock_highscore') || '0');
        } catch (e) {}

        function saveProgress() {
            try {
                localStorage.setItem('colorblock_highscore', highScore.toString());
            } catch (e) {}
        }

        function randomColor(exclude) {
            let c;
            do {
                c = Math.floor(Math.random() * COLORS.length);
            } while (c === exclude && COLORS.length > 1);
            return c;
        }

        function resetGame() {
            player.x = Math.floor(COLS / 2);
            player.y = ROWS - 2;

            floorColors = [];
            for (let y = 0; y < ROWS; y++) {
                floorColors[y] = [];
                for (let x = 0; x < COLS; x++) {
                    floorColors[y][x] = Math.floor(Math.random() * COLORS.length);
                }
            }

            targetColor = randomColor(-1);
            floorTimer = FLOOR_CHANGE_INTERVAL;
            flashTimer = 0;
            score = 0;
            particles = [];
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x * GRID + GRID / 2,
                    y: y * GRID + GRID / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: COLORS[color]
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 18;
                ctx.fillRect(p.x - 5, p.y - 5, 10, 10);
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function changeTarget() {
            targetColor = randomColor(targetColor);
            floorTimer = FLOOR_CHANGE_INTERVAL;
            flashTimer = FLASH_DURATION;

            const current = floorColors[player.y] ? floorColors[player.y][player.x] : -1;
            if (current !== targetColor) {
                gameOver();
            } else {
                score++;
                spawnParticles(player.x, player.y, targetColor);
            }
        }

        function gameOver() {
            state = State.GAMEOVER;
            if (score > highScore) {
                highScore = score;
                saveProgress();
            }
        }

        function update() {
            if (state === State.PLAYING) {
                floorTimer--;
                if (floorTimer <= 0) {
                    changeTarget();
                }
                if (flashTimer > 0) flashTimer--;
            }
            updateParticles();
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Floor blocks
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const c = floorColors[y][x];
                    const isTarget = c === targetColor;
                    let alpha = 0.35;

                    if (flashTimer > 0) {
                        alpha = isTarget ? 0.9 : 0.06;
                    }

                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = COLORS[c];
                    ctx.shadowColor = COLORS[c];
                    ctx.shadowBlur = isTarget ? 18 : 8;
                    ctx.fillRect(x * GRID + 3, y * GRID + 3, GRID - 6, GRID - 6);
                }
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            drawParticles();

            // Player
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(
                player.x * GRID + 14,
                player.y * GRID + 14,
                GRID - 28,
                GRID - 28
            );
            ctx.shadowBlur = 0;

            // Big target GUI top middle
            const targetText = COLOR_NAMES[targetColor];
            ctx.fillStyle = COLORS[targetColor];
            ctx.shadowColor = COLORS[targetColor];
            ctx.shadowBlur = 25;
            ctx.font = 'bold 52px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(targetText, canvas.width / 2, 75);
            ctx.shadowBlur = 0;

            // Timer bar under target
            const barWidth = Math.min(500, canvas.width - 60);
            const barHeight = 14;
            const barX = (canvas.width - barWidth) / 2;
            const barY = 95;
            ctx.fillStyle = '#222';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = COLORS[targetColor];
            ctx.fillRect(barX, barY, barWidth * (floorTimer / FLOOR_CHANGE_INTERVAL), barHeight);

            // Score bottom left
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 24, canvas.height - 24);
            ctx.fillText(`BEST: ${highScore}`, 24, canvas.height - 50);

            if (state === State.MENU) drawMenu();
            else if (state === State.GAMEOVER) drawGameOver();
        }

        function drawMenu() {
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 72px Courier New';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 22;
            ctx.fillText('NEON COLOR', canvas.width / 2, canvas.height / 2 - 100);
            ctx.fillText('BLOCK', canvas.width / 2, canvas.height / 2 - 30);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff';
            ctx.font = '22px Courier New';
            ctx.fillText('Move to match the TARGET color', canvas.width / 2, canvas.height / 2 + 30);
            ctx.fillText('Use WASD / ARROW KEYS', canvas.width / 2, canvas.height / 2 + 60);
            ctx.fillText('Survive as long as possible', canvas.width / 2, canvas.height / 2 + 90);

            const time = Date.now() / 1000;
            const alpha = 0.5 + Math.sin(time * 3) * 0.5;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 22px Courier New';
            ctx.fillText('PRESS ANY KEY TO START', canvas.width / 2, canvas.height / 2 + 150);
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#666';
            ctx.font = '16px Courier New';
            ctx.fillText('ESC to return to Arcade', canvas.width / 2, canvas.height / 2 + 190);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f00';
            ctx.font = 'bold 64px Courier New';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 22;
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff';
            ctx.font = '28px Courier New';
            ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);

            if (score > 0 && score >= highScore) {
                ctx.fillStyle = '#ff0';
                ctx.fillText('NEW HIGH SCORE!', canvas.width / 2, canvas.height / 2 + 55);
            } else {
                ctx.fillStyle = '#aaa';
                ctx.font = '20px Courier New';
                ctx.fillText(`Best: ${highScore}`, canvas.width / 2, canvas.height / 2 + 55);
            }

            const time = Date.now() / 1000;
            const alpha = 0.5 + Math.sin(time * 3) * 0.5;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 20px Courier New';
            ctx.fillText('PRESS ANY KEY TO RETRY', canvas.width / 2, canvas.height / 2 + 100);
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#666';
            ctx.font = '16px Courier New';
            ctx.fillText('ESC to return to Arcade', canvas.width / 2, canvas.height / 2 + 130);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                window.location.href = 'index.html';
                return;
            }

            if (state === State.MENU) {
                resetGame();
                state = State.PLAYING;
                return;
            }

            if (state === State.GAMEOVER) {
                resetGame();
                state = State.PLAYING;
                return;
            }

            if (state === State.PLAYING) {
                let dx = 0;
                let dy = 0;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dy = -1;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dy = 1;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -1;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = 1;

                if (dx !== 0 || dy !== 0) {
                    const nx = player.x + dx;
                    const ny = player.y + dy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        player.x = nx;
                        player.y = ny;
                    }
                }
            }
        });

        resetGame();
        loop();
    </script>
</body>
</html>
