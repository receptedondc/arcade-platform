<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tower Defense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #fff;
            user-select: none;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            z-index: 2;
        }
        .hud {
            background: rgba(0,0,0,0.55);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 1px;
        }
        #controls {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 2;
            background: rgba(0,0,0,0.55);
            border: 1px solid #333;
            padding: 10px;
            border-radius: 10px;
        }
        .tower-btn {
            background: #111;
            border: 2px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: all 0.15s;
            text-align: left;
            min-width: 110px;
        }
        .tower-btn:hover {
            border-color: #00ffff;
            box-shadow: 0 0 14px rgba(0,255,255,0.35);
        }
        .tower-btn.selected {
            border-color: #00ffff;
            background: #0a5a5a;
            box-shadow: 0 0 24px rgba(0,255,255,0.9);
        }
        .tower-btn .cost {
            color: #ffd700;
            font-size: 11px;
            display: block;
            margin-top: 4px;
        }
        #startWave {
            background: #0a3a0a;
            border-color: #00ff00;
            color: #00ff00;
            font-weight: bold;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        #startWave:hover {
            background: #0a5a0a;
            box-shadow: 0 0 18px rgba(0,255,0,0.5);
        }
        #backToArcade {
            background: #222;
            border-color: #666;
            color: #aaa;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        #backToArcade:hover {
            background: #2a2a2a;
            box-shadow: 0 0 12px rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="hud" style="color:#00ffff;">LIVES: <span id="lives">20</span></div>
        <div class="hud" style="color:#ffd700;">GOLD: <span id="gold">150</span></div>
        <div class="hud" style="color:#ff00ff;">WAVE: <span id="wave">0</span></div>
        <div class="hud" style="color:#aaa;">KILLS: <span id="kills">0</span></div>
        <div class="hud" style="color:#0ff;">GEMS: <span id="pending">0</span></div>
        <div class="hud" style="color:#ff00ff;">TOTAL GEMS: <span id="shopDisplay">150</span></div>
    </div>
    <div id="waveTimer" style="position:absolute; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.55); border: 1px solid #333; padding: 6px 14px; border-radius: 8px; font-size: 16px; color: #0ff; display: none; z-index: 2;">NEXT WAVE: <span id="timerText">15</span>s</div>
    <div id="controls">
        <button class="tower-btn" data-tower="blaster">🔫 BLASTER [1]<span class="cost">FREE</span></button>
        <button class="tower-btn" data-tower="sniper">🎯 SNIPER [2]<span class="cost">300g</span></button>
        <button class="tower-btn" data-tower="cannon">💣 CANNON [3]<span class="cost">500g</span></button>
        <button class="tower-btn" data-tower="slow">❄️ SLOW [4]<span class="cost">400g</span></button>
        <button id="startWave">▶ START WAVE</button>
        <button id="skipWave" style="display:none; background:#0a3a0a; border-color:#ffff00; color:#ffff00; font-weight:bold;">✓ SKIP</button>
        <button id="backToArcade">← ARCADE</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const State = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let state = State.MENU;

        const TILE_SIZE = 40;
        let GRID_COLS = Math.floor(canvas.width / TILE_SIZE);
        let GRID_ROWS = Math.floor(canvas.height / TILE_SIZE);
        let MAP_OFFSET_X = (canvas.width - GRID_COLS * TILE_SIZE) / 2;
        let MAP_OFFSET_Y = (canvas.height - GRID_ROWS * TILE_SIZE) / 2;

        const TOWER_TYPES = {
            blaster: { 
                name:'Blaster', cost:0, range:120, fireRate:24, damage:1.2, 
                color:'#00ffff', bulletColor:'#00ffff', bulletSpeed:8,
                upgrades: { multishot: { max:2, cost:[60,120], desc:'+1 shot' }, piercing: { max:1, cost:[80], desc:'Pierce enemies' } }
            },
            sniper:  { 
                name:'Sniper', cost:300, range:240, fireRate:65, damage:5, 
                color:'#ff00ff', bulletColor:'#ff00ff', bulletSpeed:13,
                upgrades: { critChance: { max:50, cost:[100,200,300], desc:'+10% crit' }, critDamage: { max:100, cost:[150,300], desc:'+1x crit dmg' } }
            },
            cannon:  { 
                name:'Cannon', cost:500, range:150, fireRate:85, damage:3.5, 
                color:'#ffaa00', bulletColor:'#ffaa00', bulletSpeed:6, splash:55,
                upgrades: { splashRadius: { max:80, cost:[120,240], desc:'+25 splash' }, fragments: { max:3, cost:[200,350,500], desc:'+1 fragment' } }
            },
            slow:    { 
                name:'Slow', cost:400, range:130, fireRate:40, damage:0.6, 
                color:'#00ffff', bulletColor:'#00ffff', bulletSpeed:7, slow:0.55,
                upgrades: { duration: { max:60, cost:[80,160,240], desc:'+15 slow time' }, strength: { max:25, cost:[100,200], desc:'+5% slow' }, aura: { max:1, cost:[300], desc:'Aura mode' } }
            }
        };

        const ENEMY_TYPES = {
            basic: { hp:6, speed:1.1, color:'#ff3333', reward:10, radius:10 },
            fast:  { hp:4,  speed:2.2, color:'#ffff00', reward:15, radius:8 },
            tank:  { hp:16, speed:0.6, color:'#ff8800', reward:25, radius:14 },
            boss:  { hp:70,speed:0.45, color:'#ff0000', reward:100,radius:20 }
        };

        let gold = 150;
        let lives = 20;
        let wave = 0;
        let kills = 0;
        let selectedTower = null;

        // Shop system
        let shopCurrency = parseInt(localStorage.getItem('ntd_shopCurrency') || '150');
        let pendingCurrency = parseInt(localStorage.getItem('ntd_pendingCurrency') || '0');
        let loadout = JSON.parse(localStorage.getItem('ntd_loadout') || '["blaster",null,null,null]');
        let cashedInAmount = 0;
        const MAX_LOADOUT = 4;
        const TOWER_COSTS = { blaster: 0, sniper: 300, cannon: 500, slow: 400 };
        
        // Migrate old loadout format to new slot format
        if (loadout.length > 0 && loadout.every(item => typeof item === 'string')) {
            const newLoadout = [null, null, null, null];
            loadout.forEach((type, i) => {
                if (i < MAX_LOADOUT) newLoadout[i] = type;
            });
            if (!newLoadout.includes('blaster')) newLoadout[0] = 'blaster';
            loadout = newLoadout;
            saveShop();
        }
        if (!loadout.includes('blaster')) { loadout[0] = 'blaster'; saveShop(); }
        let hoverX = 0;
        let hoverY = 0;
        let towers = [];
        let enemies = [];
        let bullets = [];
        let particles = [];
        let waveActive = false;
        let waveQueue = [];
        let spawnTimer = 0;
        let menuSelection = null;
        let selectedInfoTower = null;
        let hoveredEnemy = null;
        let autoWaveTimer = 0;
        let autoWaveInterval = 15;
        let skipAvailable = false;
        let waveStartTime = 0;

        const path = [];
        function buildPath() {
            path.length = 0;
            const sx = MAP_OFFSET_X;
            const sy = MAP_OFFSET_Y + Math.floor(GRID_ROWS/2)*TILE_SIZE + TILE_SIZE/2;
            const ex = MAP_OFFSET_X + GRID_COLS*TILE_SIZE;
            const ey = sy;
            const y1 = sy - 160;
            const y2 = sy + 160;
            path.push({x:sx,y:sy});
            path.push({x:sx+GRID_COLS*TILE_SIZE*0.22,y:y1});
            path.push({x:sx+GRID_COLS*TILE_SIZE*0.48,y:y1});
            path.push({x:sx+GRID_COLS*TILE_SIZE*0.48,y:y2});
            path.push({x:sx+GRID_COLS*TILE_SIZE*0.74,y:y2});
            path.push({x:sx+GRID_COLS*TILE_SIZE*0.74,y:sy});
            path.push({x:ex,y:ey});
        }

        function saveShop() {
            localStorage.setItem('ntd_shopCurrency', shopCurrency);
            localStorage.setItem('ntd_pendingCurrency', pendingCurrency);
            localStorage.setItem('ntd_loadout', JSON.stringify(loadout));
        }

        function getSlotForTower(type) {
            return loadout.indexOf(type);
        }

        function updateControls() {
            document.querySelectorAll('.tower-btn[data-tower]').forEach(btn => {
                const type = btn.dataset.tower;
                const slot = getSlotForTower(type);
                const owned = slot !== -1;
                const canBuy = !owned && shopCurrency >= TOWER_COSTS[type] && loadout.filter(s => s !== null).length < MAX_LOADOUT;
                btn.style.display = '';
                btn.classList.toggle('selected', selectedTower === type);
                
                // Update button text
                const costSpan = btn.querySelector('.cost');
                if (costSpan) {
                    if (TOWER_COSTS[type] === 0) {
                        costSpan.textContent = 'FREE';
                    } else if (owned) {
                        costSpan.textContent = `SLOT ${slot + 1}`;
                    } else {
                        costSpan.textContent = `${TOWER_COSTS[type]} Gems`;
                    }
                }
                
                // Update button style based on state
                if (owned) {
                    btn.style.borderColor = '#0f0';
                    btn.style.opacity = '1';
                } else if (canBuy) {
                    btn.style.borderColor = '#00ffff';
                    btn.style.opacity = '1';
                } else {
                    btn.style.borderColor = '#333';
                    btn.style.opacity = '0.6';
                }
            });
        }

        function toggleTower(type) {
            const slot = getSlotForTower(type);
            if (slot !== -1) {
                // Unequip
                loadout[slot] = null;
            } else {
                // Try to equip
                const emptySlot = loadout.indexOf(null);
                if (emptySlot === -1) return false; // No empty slots
                const cost = TOWER_COSTS[type];
                if (shopCurrency < cost) return false;
                if (cost > 0) shopCurrency -= cost;
                loadout[emptySlot] = type;
            }
            saveShop();
            document.getElementById('shopDisplay').textContent = shopCurrency;
            updateControls();
            return true;
        }

        function upgradeTower(t) {
            const def = TOWER_TYPES[t.type];
            const upgs = def.upgrades;
            let upgraded = false;
            
            // Find next available upgrade
            for (const [key, cfg] of Object.entries(upgs)) {
                const current = t.upgrades[key] || 0;
                if (current >= cfg.max) continue;
                const cost = cfg.cost[current];
                if (gold < cost) continue;
                gold -= cost;
                document.getElementById('gold').textContent = gold;
                t.upgrades[key] = current + 1;
                upgraded = true;
                break;
            }
            
            if (!upgraded) return;
            
            // Apply upgrade effects
            applyUpgradeEffects(t);
            for (let p = 0; p < 12; p++) particles.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,radius:Math.random()*3+1,color:def.color,life:24});
        }

        function applyUpgradeEffects(t) {
            const def = TOWER_TYPES[t.type];
            const base = { ...def };
            delete base.upgrades;
            delete base.name;
            delete base.cost;
            
            // Reset to base stats
            Object.assign(t, base);
            t.upgradeLevel = 0;
            t.upgrades = {};
            
            // Recalculate from upgrades
            for (const [key, level] of Object.entries(t.upgrades || {})) {
                const cfg = def.upgrades[key];
                if (!cfg) continue;
                t.upgradeLevel += level;
                switch(key) {
                    case 'multishot': t.multishot = level; break;
                    case 'piercing': t.piercing = level > 0; break;
                    case 'critChance': t.critChance = level * 0.1; break;
                    case 'critDamage': t.critMultiplier = 2 + level; break;
                    case 'splashRadius': t.splash = 55 + level * 25; break;
                    case 'fragments': t.fragments = level; break;
                    case 'duration': t.slowDuration = 35 + level * 15; break;
                    case 'strength': t.slowStrength = Math.min(0.8, 0.55 + level * 0.05); break;
                    case 'aura': t.aura = level > 0; break;
                }
            }
        }

        function resetGame() {
            gold = 250;
            lives = 20;
            wave = 0;
            kills = 0;
            pendingCurrency = 0;
            cashedInAmount = 0;
            selectedTower = null;
            selectedInfoTower = null;
            towers = [];
            enemies = [];
            bullets = [];
            particles = [];
            waveActive = false;
            waveQueue = [];
            spawnTimer = 0;
            menuSelection = null;
            autoWaveTimer = 15;
            autoWaveInterval = 15;
            skipAvailable = false;
            waveStartTime = 0;
            document.getElementById('lives').textContent = lives;
            document.getElementById('gold').textContent = gold;
            document.getElementById('wave').textContent = wave;
            document.getElementById('kills').textContent = kills;
            document.getElementById('pending').textContent = pendingCurrency;
            document.getElementById('shopDisplay').textContent = shopCurrency;
            updateControls();
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            GRID_COLS = Math.floor(canvas.width / TILE_SIZE);
            GRID_ROWS = Math.floor(canvas.height / TILE_SIZE);
            MAP_OFFSET_X = (canvas.width - GRID_COLS * TILE_SIZE) / 2;
            MAP_OFFSET_Y = (canvas.height - GRID_ROWS * TILE_SIZE) / 2;
            buildPath();
        }

        function spawnEnemy(type) {
            const def = ENEMY_TYPES[type];
            const scale = 1 + wave * 0.12;
            enemies.push({
                type,
                x: path[0].x,
                y: path[0].y,
                hp: def.hp * scale,
                maxHp: def.hp * scale,
                speed: def.speed,
                baseSpeed: def.speed,
                color: def.color,
                reward: def.reward,
                radius: def.radius,
                pathIndex: 0,
                slowTimer: 0
            });
        }

        function startNextWave() {
            wave++;
            document.getElementById('wave').textContent = wave;
            waveQueue = [];
            const count = 5 + wave * 2;
            for (let i = 0; i < count; i++) {
                let type = 'basic';
                const r = Math.random();
                if (wave >= 3 && r < 0.15) type = 'tank';
                else if (wave >= 2 && r < 0.35) type = 'fast';
                waveQueue.push(type);
            }
            if (wave % 5 === 0) waveQueue.push('boss');
            waveIndex = 0;
            spawnTimer = 0;
            waveActive = true;
            waveStartTime = Date.now();
            skipAvailable = false;
            document.getElementById('skipWave').style.display = 'none';
            document.getElementById('waveTimer').style.display = 'none';
        }

        function update() {
            if (state !== State.PLAYING) return;
            if (lives <= 0) {
                const cashedIn = pendingCurrency;
                shopCurrency += pendingCurrency;
                pendingCurrency = 0;
                saveShop();
                document.getElementById('shopDisplay').textContent = shopCurrency;
                state = State.GAMEOVER;
                cashedInAmount = cashedIn;
                return;
            }

            if (waveActive) {
                spawnTimer--;
                if (spawnTimer <= 0 && waveQueue.length > 0) {
                    spawnEnemy(waveQueue.shift());
                    spawnTimer = 38;
                }
                if (waveQueue.length === 0 && enemies.length === 0) {
                    waveActive = false;
                    pendingCurrency += 20 + wave * 8;
                    document.getElementById('pending').textContent = pendingCurrency;
                    autoWaveTimer = autoWaveInterval;
                }
                // Skip availability after 10s
                if (!skipAvailable && Date.now() - waveStartTime > 10000) {
                    skipAvailable = true;
                    document.getElementById('skipWave').style.display = '';
                }
            } else if (lives > 0) {
                document.getElementById('wave').textContent = wave;
                // Auto-start countdown
                if (autoWaveTimer > 0) {
                    autoWaveTimer--;
                    document.getElementById('timerText').textContent = autoWaveTimer;
                    document.getElementById('waveTimer').style.display = '';
                    if (autoWaveTimer <= 0) {
                        document.getElementById('waveTimer').style.display = 'none';
                        startNextWave();
                    }
                } else {
                    document.getElementById('waveTimer').style.display = 'none';
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const targetIndex = Math.min(e.pathIndex + 1, path.length - 1);
                const target = path[targetIndex];
                const dx = target.x - e.x;
                const dy = target.y - e.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 4) {
                    e.pathIndex = targetIndex;
                    if (e.pathIndex >= path.length - 1) {
                        lives--;
                        document.getElementById('lives').textContent = lives;
                        enemies.splice(i, 1);
                        continue;
                    }
                } else {
                    const slowMult = e.slowTimer > 0 ? (e.slowStrength || 0.55) : 1;
                    e.x += (dx / dist) * e.speed * slowMult;
                    e.y += (dy / dist) * e.speed * slowMult;
                }
                if (e.slowTimer > 0) e.slowTimer--;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                if (b.life <= 0) { bullets.splice(i, 1); continue; }
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
                        e.hp -= b.damage;
                        if (b.slow) {
                            e.slowTimer = b.slowDuration || 35;
                            e.slowStrength = b.slowStrength || 0.55;
                        }
                        if (b.splash > 0) {
                            const splashR = b.splash || 55;
                            for (let k = enemies.length - 1; k >= 0; k--) {
                                const o = enemies[k];
                                if (Math.hypot(b.x - o.x, b.y - o.y) < splashR) {
                                    o.hp -= b.damage * 0.6;
                                    if (b.slow) {
                                        o.slowTimer = b.slowDuration || 35;
                                        o.slowStrength = b.slowStrength || 0.55;
                                    }
                                }
                            }
                            for (let p = 0; p < 6; p++) particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,radius:Math.random()*2+1,color:'#ffaa00',life:18});
                        }
                        // Fragments for cannon
                        if (b.fragments > 0) {
                            for (let f = 0; f < b.fragments; f++) {
                                const fAngle = Math.random() * Math.PI * 2;
                                const fDist = 20 + Math.random() * 30;
                                particles.push({
                                    x: b.x, y: b.y,
                                    vx: Math.cos(fAngle) * 3,
                                    vy: Math.sin(fAngle) * 3,
                                    radius: 3,
                                    color: '#ffaa00',
                                    life: 20,
                                    damage: b.damage * 0.4
                                });
                            }
                        }
                        if (e.hp <= 0) {
                            gold += e.reward;
                            kills++;
                            document.getElementById('gold').textContent = gold;
                            document.getElementById('kills').textContent = kills;
                            for (let p = 0; p < 8; p++) particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,radius:Math.random()*2+1,color:e.color,life:22});
                            enemies.splice(j, 1);
                        }
                        hit = true;
                        if (!b.piercing) break;
                    }
                }
                if (hit) bullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            towers.forEach(t => {
                if (t.cooldown > 0) t.cooldown--;
                if (t.cooldown <= 0) {
                    const target = getTarget(t);
                    if (target) {
                        const dx = target.x - t.x;
                        const dy = target.y - t.y;
                        const dist = Math.hypot(dx, dy);
                        const aimX = target.x + (dx / (dist || 1)) * target.speed * (dist / (t.bulletSpeed || 1)) * 0.55;
                        const aimY = target.y + (dy / (dist || 1)) * target.speed * (dist / (t.bulletSpeed || 1)) * 0.55;
                        const angle = Math.atan2(aimY - t.y, aimX - t.x);
                        t.angle = angle;
                        
                        const shots = t.multishot ? t.multishot + 1 : 1;
                        const spread = t.multishot ? 0.15 : 0;
                        
                        for (let s = 0; s < shots; s++) {
                            const shotAngle = angle + (s - (shots - 1) / 2) * spread;
                            let damage = t.damage;
                            let isCrit = false;
                            
                            // Crit calculation for sniper
                            if (t.critChance && Math.random() < t.critChance) {
                                damage *= t.critMultiplier;
                                isCrit = true;
                            }
                            
                            bullets.push({
                                x: t.x,
                                y: t.y,
                                vx: Math.cos(shotAngle) * t.bulletSpeed,
                                vy: Math.sin(shotAngle) * t.bulletSpeed,
                                radius: 7,
                                damage: damage,
                                color: isCrit ? '#ff0' : t.bulletColor,
                                life: 140,
                                splash: t.splash || 0,
                                slow: t.slow || 0,
                                slowDuration: t.slowDuration || 35,
                                slowStrength: t.slowStrength || 0.55,
                                piercing: t.piercing || false,
                                fragments: t.fragments || 0
                            });
                        }
                        t.cooldown = t.fireRate;
                    }
                }
            });
            
            // Aura slow for Slow towers
            towers.forEach(t => {
                if (t.type === 'slow' && t.aura) {
                    enemies.forEach(e => {
                        if (Math.hypot(e.x - t.x, e.y - t.y) <= t.range) {
                            e.slowTimer = Math.max(e.slowTimer, t.slowDuration || 35);
                            e.slowStrength = t.slowStrength || 0.55;
                        }
                    });
                }
            });
        }

        function getTarget(tower) {
            let inRange = enemies.filter(e => Math.hypot(e.x - tower.x, e.y - tower.y) <= tower.range);
            
            // Slow towers prefer non-slowed targets
            if (tower.type === 'slow') {
                const notSlowed = inRange.filter(e => e.slowTimer <= 0);
                if (notSlowed.length > 0) inRange = notSlowed;
            }
            
            if (inRange.length === 0) return null;
            switch (tower.targeting) {
                case 'first': {
                    let best = null;
                    let bestIdx = Infinity;
                    inRange.forEach(e => { if (e.pathIndex < bestIdx) { bestIdx = e.pathIndex; best = e; } });
                    return best;
                }
                case 'strongest': return inRange.reduce((a,b) => a.hp > b.hp ? a : b);
                case 'closest': return inRange.reduce((a,b) => Math.hypot(a.x-tower.x,a.y-tower.y) < Math.hypot(b.x-tower.x,b.y-tower.y) ? a : b);
                case 'random': return inRange[Math.floor(Math.random()*inRange.length)];
                default: return inRange[0];
            }
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 1;
            for (let x = 0; x <= GRID_COLS; x++) {
                ctx.beginPath(); ctx.moveTo(MAP_OFFSET_X + x*TILE_SIZE, MAP_OFFSET_Y); ctx.lineTo(MAP_OFFSET_X + x*TILE_SIZE, MAP_OFFSET_Y + GRID_ROWS*TILE_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= GRID_ROWS; y++) {
                ctx.beginPath(); ctx.moveTo(MAP_OFFSET_X, MAP_OFFSET_Y + y*TILE_SIZE); ctx.lineTo(MAP_OFFSET_X + GRID_COLS*TILE_SIZE, MAP_OFFSET_Y + y*TILE_SIZE); ctx.stroke();
            }

            if (path.length > 1) {
                ctx.strokeStyle = '#2f2f2f';
                ctx.lineWidth = TILE_SIZE * 0.85;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                ctx.stroke();

                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.setLineDash([5,5]);
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if (selectedTower && state === State.PLAYING) {
                const def = TOWER_TYPES[selectedTower];
                const gx = Math.floor((hoverX - MAP_OFFSET_X)/TILE_SIZE);
                const gy = Math.floor((hoverY - MAP_OFFSET_Y)/TILE_SIZE);
                const wx = MAP_OFFSET_X + gx*TILE_SIZE + TILE_SIZE/2;
                const wy = MAP_OFFSET_Y + gy*TILE_SIZE + TILE_SIZE/2;
                const valid = gx >= 0 && gx < GRID_COLS && gy >= 0 && gy < GRID_ROWS && !onPath(wx,wy) && !towers.some(t => Math.hypot(t.x-wx,t.y-wy) < TILE_SIZE*0.5);
                ctx.strokeStyle = valid ? 'rgba(0,255,0,0.35)' : 'rgba(255,0,0,0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(wx,wy,def.range,0,Math.PI*2); ctx.stroke();
                ctx.globalAlpha = 0.35;
                ctx.fillStyle = valid ? '#0f0' : '#f00';
                ctx.beginPath(); ctx.arc(wx,wy,TILE_SIZE*0.4,0,Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            }

            towers.forEach(t => {
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = t.color;
                
                switch(t.type) {
                    case 'blaster':
                        // Circle with directional arrow
                        ctx.beginPath(); ctx.arc(t.x,t.y,10,0,Math.PI*2); ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(t.x,t.y,4,0,Math.PI*2); ctx.fill();
                        ctx.strokeStyle = '#222';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(t.x+Math.cos(t.angle)*14,t.y+Math.sin(t.angle)*14); ctx.stroke();
                        break;
                    case 'sniper':
                        // Long thin barrel
                        ctx.fillStyle = t.color;
                        ctx.fillRect(t.x - 2, t.y - 12, 4, 24);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(t.x,t.y,3,0,Math.PI*2); ctx.fill();
                        break;
                    case 'cannon':
                        // Large square with cross
                        ctx.fillRect(t.x - 12, t.y - 12, 24, 24);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#222';
                        ctx.fillRect(t.x - 6, t.y - 6, 12, 12);
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(t.x - 2, t.y - 10, 4, 20);
                        ctx.fillRect(t.x - 10, t.y - 2, 20, 4);
                        break;
                    case 'slow':
                        // Diamond shape
                        ctx.beginPath();
                        ctx.moveTo(t.x, t.y - 12);
                        ctx.lineTo(t.x + 10, t.y);
                        ctx.lineTo(t.x, t.y + 12);
                        ctx.lineTo(t.x - 10, t.y);
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(t.x,t.y,4,0,Math.PI*2); ctx.fill();
                        break;
                }
                
                if (t.aura && t.type === 'slow') {
                    ctx.strokeStyle = 'rgba(0,255,255,0.2)';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2); ctx.stroke();
                }
                if (t.upgradeLevel > 0) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = 'bold 10px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(`+${t.upgradeLevel}`, t.x, t.y - 18);
                }
                if (selectedInfoTower === t) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#fff';
                    ctx.shadowBlur = 14;
                    ctx.beginPath(); ctx.arc(t.x, t.y, 17, 0, Math.PI*2); ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            enemies.forEach(e => {
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x,e.y,e.radius,0,Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                const pct = e.hp / e.maxHp;
                ctx.fillStyle = '#333';
                ctx.fillRect(e.x-15, e.y - e.radius - 8, 30, 4);
                ctx.fillStyle = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#ff0' : '#f00';
                ctx.fillRect(e.x-15, e.y - e.radius - 8, 30*pct, 4);
                if (e.slowTimer > 0) {
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(e.x,e.y,e.radius+3,0,Math.PI*2); ctx.stroke();
                }
                if (hoveredEnemy === e) {
                    const hpText = `${Math.ceil(e.hp)}/${Math.ceil(e.maxHp)} HP`;
                    ctx.font = 'bold 11px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#000';
                    ctx.fillText(hpText, e.x + 1, e.y - e.radius - 12);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(hpText, e.x, e.y - e.radius - 12);
                }
            });

            bullets.forEach(b => {
                ctx.shadowColor = b.color;
                ctx.shadowBlur = b.piercing ? 12 : 8;
                ctx.fillStyle = b.piercing ? '#fff' : b.color;
                ctx.beginPath(); ctx.arc(b.x,b.y,b.radius + (b.piercing ? 2 : 0),0,Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life/35);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.radius,0,Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            if (path.length > 1) {
                ctx.shadowColor = '#0f0';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#0f0';
                ctx.font = '20px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('START', path[0].x, path[0].y + 6);
                ctx.shadowColor = '#f00';
                ctx.fillStyle = '#f00';
                ctx.fillText('BASE', path[path.length-1].x, path[path.length-1].y + 6);
                ctx.shadowBlur = 0;
                const base = path[path.length-1];
                const maxLives = 20;
                const pct = Math.max(0, lives / maxLives);
                ctx.fillStyle = '#300';
                ctx.fillRect(base.x - 25, base.y + 14, 50, 6);
                ctx.fillStyle = pct > 0.5 ? '#f00' : pct > 0.25 ? '#ff0' : '#f00';
                ctx.fillRect(base.x - 25, base.y + 14, 50 * pct, 6);
                ctx.strokeStyle = '#f00';
                ctx.lineWidth = 1;
                ctx.strokeRect(base.x - 25, base.y + 14, 50, 6);
            }

            if (state === State.MENU) drawMenu();
            if (state === State.GAMEOVER) drawGameOver();

            // Upgrade info panel - always on top
            if (selectedInfoTower && state === State.PLAYING) {
                const t = selectedInfoTower;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2); ctx.stroke();
                ctx.shadowBlur = 0;
                const def = TOWER_TYPES[t.type];
                const upgs = def.upgrades;
                
                let lines = [
                    `${def.name.toUpperCase()} LVL ${t.upgradeLevel}`,
                    `DMG: ${t.damage.toFixed(1)}`,
                    `RNG: ${t.range}`,
                    `SPD: ${t.fireRate}`
                ];
                
                // Add type-specific stats
                if (t.type === 'blaster') {
                    lines.push(`SHOTS: ${(t.multishot || 0) + 1}`);
                    lines.push(t.piercing ? 'PIERCING' : 'NO PIERCING');
                } else if (t.type === 'sniper') {
                    lines.push(`CRIT: ${((t.critChance || 0) * 100).toFixed(0)}%`);
                    lines.push(`CRIT DMG: x${t.critMultiplier || 2}`);
                } else if (t.type === 'cannon') {
                    lines.push(`SPLASH: ${t.splash || 55}`);
                    lines.push(`FRAGS: ${t.fragments || 0}`);
                } else if (t.type === 'slow') {
                    lines.push(`SLOW: ${((t.slowStrength || 0.55) * 100).toFixed(0)}%`);
                    lines.push(`DUR: ${t.slowDuration || 35}`);
                    lines.push(t.aura ? 'AURA: ON' : 'AURA: OFF');
                }
                
                // Show next upgrade
                let nextUpgrade = null;
                for (const [key, cfg] of Object.entries(upgs)) {
                    const current = t.upgrades[key] || 0;
                    if (current < cfg.max) {
                        nextUpgrade = { key, desc: cfg.desc, cost: cfg.cost[current] };
                        break;
                    }
                }
                
                if (nextUpgrade) {
                    lines.push(`NEXT: ${nextUpgrade.desc}`);
                    lines.push(`UPGRADE: ${nextUpgrade.cost}g [E]`);
                } else {
                    lines.push('MAX LEVEL');
                }
                
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                const tw = 180;
                const th = 24 + lines.length * 20;
                const tx = Math.min(t.x + 24, canvas.width - tw - 10);
                const ty = Math.max(t.y - th/2, 10);
                ctx.fillStyle = 'rgba(0,0,0,0.92)';
                ctx.fillRect(tx, ty, tw, th);
                ctx.strokeStyle = t.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 10;
                ctx.strokeRect(tx, ty, tw, th);
                ctx.shadowBlur = 0;
                lines.forEach((line, i) => {
                    ctx.fillStyle = line.includes('UPGRADE') ? '#0f0' : line.includes('MAX') ? '#ff0' : line.includes('NEXT') ? '#0ff' : '#fff';
                    ctx.font = line.includes('UPGRADE') || line.includes('MAX') || line.includes('NEXT') ? 'bold 13px Courier New' : '13px Courier New';
                    ctx.fillText(line, tx + tw/2, ty + 18 + i * 20);
                });
            }

            document.getElementById('controls').style.display = state === State.MENU ? 'none' : '';
        }

        function drawMenu() {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 68px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 18;
            ctx.fillText('NEON TOWER DEFENSE', canvas.width/2, canvas.height/2 - 120);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 22px Courier New';
            ctx.fillText(`SHOP GEMS: ${shopCurrency}`, canvas.width/2, canvas.height/2 - 70);

            const towerList = [
                { key:'blaster', name:'Blaster', cost: TOWER_COSTS.blaster, color:'#00ffff' },

                { key:'cannon',  name:'Cannon',  cost: TOWER_COSTS.cannon,  color:'#ffaa00' },
                { key:'slow',    name:'Slow',    cost: TOWER_COSTS.slow,    color:'#00ffff' }
            ];
            const startX = canvas.width/2 - 220;

                const owned = slot !== -1;
                const emptySlots = loadout.filter(s => s === null).length;
                const canBuy = !owned && shopCurrency >= t.cost && emptySlots > 0;
                
                ctx.fillStyle = owned ? '#1a3a1a' : canBuy ? '#1a1a3a' : '#1a1a1a';
                ctx.strokeStyle = owned ? '#0f0' : canBuy ? '#00f' : '#333';
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, btnW, btnH);
                ctx.strokeRect(x, y, btnW, btnH);
                ctx.fillStyle = t.color;
                ctx.font = 'bold 14px Courier New';

                ctx.fillStyle = '#ffd700';

                if (TOWER_COSTS[t.key] === 0) {
                    ctx.fillText('FREE', x + btnW/2, y + 50);
                } else if (owned) {
                    ctx.fillText(`SLOT ${slot + 1}`, x + btnW/2, y + 50);
                } else {
                    ctx.fillText(`${TOWER_COSTS[t.key]} Gems`, x + btnW/2, y + 50);
                }
                ctx.fillStyle = '#aaa';
                ctx.font = '11px Courier New';
                ctx.fillText(owned ? 'UNEQUIP' : (canBuy ? 'EQUIP' : (TOWER_COSTS[t.key] === 0 ? 'OWNED' : 'BUY')), x + btnW/2, y + 72);
            });

            const equippedCount = loadout.filter(s => s !== null).length;
            ctx.fillStyle = '#fff';
            ctx.font = '18px Courier New';
            ctx.fillText(`EQUIPPED: ${equippedCount}/${MAX_LOADOUT}`, canvas.width/2, canvas.height/2 + 80);

            ctx.fillStyle = '#aaa';
            ctx.font = '16px Courier New';
            ctx.fillText('CLICK TO EQUIP/UNEQUIP | CLICK ANYWHERE TO START', canvas.width/2, canvas.height/2 + 110);
            ctx.fillText('Earn gems each wave. Cash in on death.', canvas.width/2, canvas.height/2 + 135);

            ctx.fillStyle = '#444';
            ctx.font = '14px Courier New';
            ctx.fillText('[1-4] Equip/Unequip Slots  [LMB] Place/View  [E] Upgrade  [RMB/DEL] Delete  [SPACE] Start Wave  [ESC] Exit', canvas.width/2, canvas.height/2 + 160);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ff3333';
            ctx.font = 'bold 64px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 40);
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 22px Courier New';
            ctx.fillText(`+${cashedInAmount} GEMS CASHED IN`, canvas.width/2, canvas.height/2 + 10);
            ctx.fillStyle = '#aaa';
            ctx.font = '16px Courier New';
            ctx.fillText(`Total Gems: ${shopCurrency}`, canvas.width/2, canvas.height/2 + 40);
            ctx.fillStyle = '#fff';
            ctx.font = '20px Courier New';
            ctx.fillText('Click to retry', canvas.width/2, canvas.height/2 + 75);
        }

        function onPath(x,y) {
            for (let i = 0; i < path.length-1; i++) {
                const a = path[i], b = path[i+1];
                const len = Math.hypot(b.x-a.x, b.y-a.y);
                const t = Math.max(0, Math.min(1, ((x-a.x)*(b.x-a.x)+(y-a.y)*(b.y-a.y))/(len*len)));
                const px = a.x + t*(b.x-a.x);
                const py = a.y + t*(b.y-a.y);
                if (Math.hypot(x-px, y-py) < TILE_SIZE*0.55) return true;
            }
            return false;
        }

        function placeTower(type, wx, wy) {
            const def = TOWER_TYPES[type];
            if (gold < def.cost) return;
            if (onPath(wx,wy)) return;
            if (towers.some(t => Math.hypot(t.x-wx,t.y-wy) < TILE_SIZE*0.5)) return;
            gold -= def.cost;
            document.getElementById('gold').textContent = gold;
            towers.push({
                type,
                x: wx,
                y: wy,
                angle: 0,
                cooldown: 0,
                damage: def.damage,
                range: def.range,
                fireRate: def.fireRate,
                bulletSpeed: def.bulletSpeed,
                bulletColor: def.bulletColor,
                color: def.color,
                splash: def.splash || 0,
                slow: def.slow || 0,
                slowDuration: 35,
                slowStrength: 0.55,
                upgradeLevel: 0,
                upgrades: {},
                multishot: 0,
                piercing: false,
                critChance: 0,
                critMultiplier: 2,
                fragments: 0,
                aura: false,
                targeting: 'first'
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            hoverX = e.clientX - rect.left;
            hoverY = e.clientY - rect.top;
            if (state !== State.PLAYING) { hoveredEnemy = null; canvas.style.cursor = 'default'; return; }
            const mx = hoverX;
            const my = hoverY;
            let foundEnemy = null;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (Math.hypot(mx - e.x, my - e.y) < e.radius + 6) {
                    foundEnemy = e;
                    break;
                }
            }
            hoveredEnemy = foundEnemy;
            const onTower = towers.some(t => Math.hypot(mx - t.x, my - t.y) < 28);
            canvas.style.cursor = onTower ? 'pointer' : 'default';
        });

        // Right-click to delete tower
        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            if (state !== State.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const clickedTower = towers.find(t => Math.hypot(t.x-mx,t.y-my) < 28);
            if (clickedTower) {
                const refund = Math.floor(TOWER_TYPES[clickedTower.type].cost * 0.5);
                gold += refund;
                document.getElementById('gold').textContent = gold;
                towers = towers.filter(t => t !== clickedTower);
                if (selectedInfoTower === clickedTower) selectedInfoTower = null;
                for (let p = 0; p < 10; p++) particles.push({x:clickedTower.x,y:clickedTower.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,radius:Math.random()*3+1,color:'#f00',life:25});
            }
        });

        canvas.addEventListener('click', e => {
            if (state === State.MENU) {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const towerList = [
                    { key:'blaster', name:'Blaster', cost: TOWER_COSTS.blaster, color:'#00ffff' },
                    { key:'sniper',  name:'Sniper',  cost: TOWER_COSTS.sniper,  color:'#ff00ff' },
                    { key:'cannon',  name:'Cannon',  cost: TOWER_COSTS.cannon,  color:'#ffaa00' },
                    { key:'slow',    name:'Slow',    cost: TOWER_COSTS.slow,    color:'#00ffff' }
                ];
                const startX = canvas.width/2 - 220;
                const btnW = 100;
                const btnH = 90;
                const gap = 20;
                let clickedTower = false;
                towerList.forEach((t, i) => {
                    const x = startX + i * (btnW + gap);
                    const y = canvas.height/2 - 20;
                    if (mx >= x && mx <= x+btnW && my >= y && my <= y+btnH) {
                        clickedTower = true;
                        toggleTower(t.key);
                    }
                });
                if (!clickedTower) {
                    resetGame();
                    state = State.PLAYING;
                }
                return;
            }
            if (state === State.GAMEOVER) {
                resetGame();
                state = State.PLAYING;
                return;
            }
            if (state !== State.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const controls = document.getElementById('controls');
            const controlsRect = controls.getBoundingClientRect();
            if (e.clientY >= controlsRect.top && e.clientY <= controlsRect.bottom) return;
            const clickedTower = towers.find(t => Math.hypot(t.x-mx,t.y-my) < 28);
            if (clickedTower) {
                selectedInfoTower = clickedTower;
                selectedTower = null;
                document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
                return;
            }
            selectedInfoTower = null;
            if (!selectedTower) return;
            const gx = Math.floor((mx - MAP_OFFSET_X)/TILE_SIZE);
            const gy = Math.floor((my - MAP_OFFSET_Y)/TILE_SIZE);
            const wx = MAP_OFFSET_X + gx*TILE_SIZE + TILE_SIZE/2;
            const wy = MAP_OFFSET_Y + gy*TILE_SIZE + TILE_SIZE/2;
            placeTower(selectedTower, wx, wy);
        });



        document.querySelectorAll('.tower-btn[data-tower]').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.tower;
                if (state !== State.PLAYING) return;
                const slot = loadout.indexOf(type);
                if (slot === -1) return; // Not owned
                if (selectedTower === type) {
                    selectedTower = null;
                    btn.classList.remove('selected');
                } else {
                    selectedTower = type;
                    document.querySelectorAll('.tower-btn[data-tower]').forEach(b => b.classList.toggle('selected', b.dataset.tower === type));
                }
            });
        });

        document.getElementById('startWave').addEventListener('click', () => {
            if (state === State.PLAYING && !waveActive) {
                autoWaveTimer = 0;
                startNextWave();
            }
        });
        document.getElementById('skipWave').addEventListener('click', () => {
            if (state === State.PLAYING && waveActive && skipAvailable) {
                // Spawn next wave immediately while current wave continues
                const partialReward = Math.floor((20 + wave * 8) * 0.6);
                pendingCurrency += partialReward;
                document.getElementById('pending').textContent = pendingCurrency;
                startNextWave();
                skipAvailable = false;
                document.getElementById('skipWave').style.display = 'none';
            }
        });
        function leaveGame() {
            // Convert pending gems to shop currency before leaving
            shopCurrency += pendingCurrency;
            pendingCurrency = 0;
            saveShop();
            window.location.href = 'arcade.html';
        }

        document.getElementById('backToArcade').addEventListener('click', leaveGame);

        window.addEventListener('beforeunload', () => {
            shopCurrency += pendingCurrency;
            pendingCurrency = 0;
            saveShop();
        });

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                leaveGame();
                return;
            }
            
            // Menu keybinds - toggle equip/unequip for slots 1-4
            if (state === State.MENU) {
                const slotIndex = parseInt(e.key) - 1;
                if (slotIndex >= 0 && slotIndex < MAX_LOADOUT) {
                    const type = loadout[slotIndex];
                    if (type) {
                        toggleTower(type);
                    }
                }
                return;
            }
            
            if (state !== State.PLAYING) return;
            if (e.key === 'e' || e.key === 'E') {
                if (selectedInfoTower) {
                    upgradeTower(selectedInfoTower);
                }
                return;
            }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedInfoTower) {
                    const refund = Math.floor(TOWER_TYPES[selectedInfoTower.type].cost * 0.5);
                    gold += refund;
                    document.getElementById('gold').textContent = gold;
                    const tx = selectedInfoTower.x;
                    const ty = selectedInfoTower.y;
                    towers = towers.filter(t => t !== selectedInfoTower);
                    selectedInfoTower = null;
                    for (let p = 0; p < 10; p++) particles.push({x:tx,y:ty,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,radius:Math.random()*3+1,color:'#f00',life:25});
                }
                return;
            }
            const slotIndex = parseInt(e.key) - 1;
            if (slotIndex >= 0 && slotIndex < loadout.length) {
                const type = loadout[slotIndex];
                if (!type) return;
                if (selectedTower === type) {
                    selectedTower = null;
                    document.querySelectorAll('.tower-btn[data-tower]').forEach(b => b.classList.remove('selected'));
                } else {
                    selectedTower = type;
                    document.querySelectorAll('.tower-btn[data-tower]').forEach(b => b.classList.toggle('selected', b.dataset.tower === type));
                }
            }
        });

        resetGame();
        loop();
    </script>
</body>
</html>
