<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Merge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            border: 2px solid #333;
            box-shadow: 0 0 40px rgba(0,255,255,0.35);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth - 40, 500);
            canvas.height = Math.min(window.innerHeight - 40, 700);
        }
        window.addEventListener('resize', resize);
        resize();

        const State = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let state = State.MENU;

        const COLS = 6;
        const CELL = 60;
        const BOARD_W = COLS * CELL;
        const BOARD_H = Math.floor(canvas.height * 0.85);
        const OFFSET_X = Math.floor((canvas.width - BOARD_W) / 2);
        const OFFSET_Y = Math.floor((canvas.height - BOARD_H) / 2);

        const COLORS = {
            2: '#00ffff',
            4: '#00ff80',
            8: '#00aaff',
            16: '#ffcc00',
            32: '#ff5500',
            64: '#aa00ff',
            128: '#ff0088',
            256: '#00ffcc',
            512: '#ff0040',
            1024: '#ffff00',
            2048: '#ff0000'
        };

        let board = [];
        let current = null;
        let score = 0;
        let bestScore = 0;
        let dropInterval = 500;
        let lastDrop = 0;
        let gameOver = false;

        try {
            bestScore = parseInt(localStorage.getItem('merge_best') || '0');
        } catch (e) {}

        function saveProgress() {
            try {
                localStorage.setItem('merge_best', bestScore.toString());
            } catch (e) {}
        }

        function resetGame() {
            board = Array(Math.floor(BOARD_H / CELL)).fill().map(() => Array(COLS).fill(0));
            score = 0;
            gameOver = false;
            lastDrop = 0;
            spawnBlock();
        }

        function spawnBlock() {
            const value = Math.random() < 0.9 ? 2 : 4;
            current = {
                x: Math.floor(COLS / 2),
                y: 0,
                value: value
            };
        }

        function isValidPosition(block, offsetX = 0, offsetY = 0) {
            const nx = block.x + offsetX;
            const ny = block.y + offsetY;
            if (nx < 0 || nx >= COLS || ny < 0) return false;
            if (ny >= board.length) return false;
            if (board[ny][nx] !== 0) return false;
            return true;
        }

        function placeBlock() {
            if (!current) return;
            const row = current.y;
            const col = current.x;
            if (row < 0 || row >= board.length || col < 0 || col >= COLS) {
                gameOver = true;
                return;
            }
            board[row][col] = current.value;
            current = null;
            checkMatches();
            spawnBlock();
            if (!isValidPosition(current)) {
                gameOver = true;
            }
        }

        function checkMatches() {
            let matched = true;
            while (matched) {
                matched = false;
                for (let y = 0; y < board.length; y++) {
                    for (let x = 0; x < COLS; x++) {
                        const val = board[y][x];
                        if (val === 0) continue;
                        // Check horizontal match
                        if (x + 2 < COLS && board[y][x + 1] === val && board[y][x + 2] === val) {
                            board[y][x] = 0;
                            board[y][x + 1] = 0;
                            board[y][x + 2] = 0;
                            score += val * 3;
                            matched = true;
                        }
                        // Check vertical match
                        if (y + 2 < board.length && board[y + 1][x] === val && board[y + 2][x] === val) {
                            board[y][x] = 0;
                            board[y + 1][x] = 0;
                            board[y + 2][x] = 0;
                            score += val * 3;
                            matched = true;
                        }
                    }
                }
                applyGravity();
            }
        }

        function applyGravity() {
            for (let x = 0; x < COLS; x++) {
                let writeY = board.length - 1;
                for (let y = board.length - 1; y >= 0; y--) {
                    if (board[y][x] !== 0) {
                        if (y !== writeY) {
                            board[writeY][x] = board[y][x];
                            board[y][x] = 0;
                        }
                        writeY--;
                    }
                }
            }
        }

        function update(timestamp) {
            if (state !== State.PLAYING || gameOver) return;
            if (timestamp - lastDrop > dropInterval) {
                lastDrop = timestamp;
                if (current && isValidPosition(current, 0, 1)) {
                    current.y++;
                } else if (current) {
                    placeBlock();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Board background
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(OFFSET_X, OFFSET_Y, BOARD_W, BOARD_H);

            // Grid lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(OFFSET_X + x * CELL, OFFSET_Y);
                ctx.lineTo(OFFSET_X + x * CELL, OFFSET_Y + BOARD_H);
                ctx.stroke();
            }
            for (let y = 0; y <= Math.floor(BOARD_H / CELL); y++) {
                ctx.beginPath();
                ctx.moveTo(OFFSET_X, OFFSET_Y + y * CELL);
                ctx.lineTo(OFFSET_X + BOARD_W, OFFSET_Y + y * CELL);
                ctx.stroke();
            }

            // Placed blocks
            for (let y = 0; y < board.length; y++) {
                for (let x = 0; x < COLS; x++) {
                    const val = board[y][x];
                    if (val === 0) continue;
                    const color = COLORS[val] || '#fff';
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = color;
                    ctx.fillRect(OFFSET_X + x * CELL + 5, OFFSET_Y + y * CELL + 5, CELL - 10, CELL - 10);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 22px Courier New';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(val, OFFSET_X + x * CELL + CELL / 2, OFFSET_Y + y * CELL + CELL / 2);
                }
            }

            // Current falling block
            if (current) {
                const color = COLORS[current.value] || '#fff';
                ctx.shadowColor = color;
                ctx.shadowBlur = 22;
                ctx.fillStyle = color;
                ctx.fillRect(OFFSET_X + current.x * CELL + 5, OFFSET_Y + current.y * CELL + 5, CELL - 10, CELL - 10);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.font = 'bold 22px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(current.value, OFFSET_X + current.x * CELL + CELL / 2, OFFSET_Y + current.y * CELL + CELL / 2);
            }

            // HUD
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 24, 35);
            ctx.fillText(`BEST: ${bestScore}`, 24, 60);

            if (state === State.MENU) drawMenu();
            else if (state === State.GAMEOVER) drawGameOver();
        }

        function drawMenu() {
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 52px Courier New';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 20;
            ctx.fillText('NEON MERGE', canvas.width / 2, canvas.height / 2 - 80);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff';
            ctx.font = '22px Courier New';
            ctx.fillText('Drop numbered blocks', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillText('A / D to move', canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText('SPACE to drop', canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('Match 3 in a row to clear them', canvas.width / 2, canvas.height / 2 + 80);

            const time = Date.now() / 1000;
            const alpha = 0.5 + Math.sin(time * 3) * 0.5;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 22px Courier New';
            ctx.fillText('PRESS ANY KEY TO START', canvas.width / 2, canvas.height / 2 + 140);
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#666';
            ctx.font = '16px Courier New';
            ctx.fillText('ESC to return to Arcade', canvas.width / 2, canvas.height / 2 + 180);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f00';
            ctx.font = 'bold 56px Courier New';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 20;
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff';
            ctx.font = '28px Courier New';
            ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);

            if (score > 0 && score >= bestScore) {
                ctx.fillStyle = '#ff0';
                ctx.fillText('NEW BEST!', canvas.width / 2, canvas.height / 2 + 55);
            } else {
                ctx.fillStyle = '#aaa';
                ctx.font = '20px Courier New';
                ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, canvas.height / 2 + 55);
            }

            const time = Date.now() / 1000;
            const alpha = 0.5 + Math.sin(time * 3) * 0.5;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 20px Courier New';
            ctx.fillText('PRESS ANY KEY TO RETRY', canvas.width / 2, canvas.height / 2 + 100);
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#666';
            ctx.font = '16px Courier New';
            ctx.fillText('ESC to return to Arcade', canvas.width / 2, canvas.height / 2 + 130);
        }

        function loop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                window.location.href = 'index.html';
                return;
            }

            if (state === State.MENU) {
                resetGame();
                state = State.PLAYING;
                return;
            }

            if (state === State.GAMEOVER) {
                if (score > bestScore) {
                    bestScore = score;
                    saveProgress();
                }
                resetGame();
                state = State.PLAYING;
                return;
            }

            if (state === State.PLAYING && current) {
                if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
                    if (isValidPosition(current, -1, 0)) current.x--;
                }
                if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
                    if (isValidPosition(current, 1, 0)) current.x++;
                }
                if (e.key === ' ') {
                    e.preventDefault();
                    while (isValidPosition(current, 0, 1)) {
                        current.y++;
                    }
                    placeBlock();
                }
            }
        });

        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
